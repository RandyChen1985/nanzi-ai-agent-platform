version: '3.8'

services:
  ai-agent:
    image: nanzi-ai-agent:latest
    container_name: nanzi-ai-agent
    ports:
      - "8001:8001"
    volumes:
      # 宿主机数据目录对齐挂载：支持通过 HOST_DATA_DIR 指定宿主机绝对路径，默认使用相对路径 ./data
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ~/.agents/skills:/app/data/skills
      # 挂载宿主机 Docker Socket，支持平台在容器化部署时通过宿主机 Docker 动态创建与管理沙箱容器 (DooD 架构)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Service Config
      - API_SERVICE_ENV=${API_SERVICE_ENV:-dev}
      - API_SERVICE_LOG_LEVEL=${API_SERVICE_LOG_LEVEL:-INFO}
      # 平台公网访问地址；Echo MCP 会据此生成访问地址和 Host/Origin 白名单
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      # 多节点部署时只在一个节点设为 true，其他 API 节点设为 false
      - TASK_SCHEDULER_ENABLED=${TASK_SCHEDULER_ENABLED:-true}
      # 宿主机数据目录真实物理路径（DooD 沙箱容器挂载对齐，留空则自动按容器工作区解析）
      - HOST_DATA_DIR=${HOST_DATA_DIR:-}
      # 业务默认时区（与系统配置 platform_timezone 默认值一致；无法改 MySQL 时仍可对齐应用写入时间）
      - TZ=${TZ:-Asia/Shanghai}
      - PLATFORM_TIMEZONE=${PLATFORM_TIMEZONE:-Asia/Shanghai}

      # Main database
      - DATABASE_TYPE=${DATABASE_TYPE:-mysql}

      # MySQL (Mock / External)
      - MYSQL_HOST=${MYSQL_HOST:-mysql} # 假设有名为 mysql 的服务或外部注入
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-nanzi_ai_agent_platform}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-root123}

      # PostgreSQL (used when DATABASE_TYPE=postgresql)
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-nanzi_ai_agent_platform}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your_password}

      # Redis (Internal Service)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-root123}
      - REDIS_ENABLE=${REDIS_ENABLE:-true}

      # Security
      - API_SERVICE_API_KEY_HASH_ALGORITHM=${API_SERVICE_API_KEY_HASH_ALGORITHM:-sha256}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Jira Integration
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_PASSWORD=${JIRA_PASSWORD}

      # SSO 统一认证（portal-web 的 check/login）
      # 不填则使用后端代码默认值；一旦填写，SSO_API_URL 必须是绝对地址——
      # 用户列表接口由它派生（同域不同 path），写成相对路径会在启动后抛 ValueError。
      - SSO_API_URL=${SSO_API_URL:-https://yovole.net/api/v1/user/check/login}
      - SSO_ACCESS_TOKEN=${SSO_ACCESS_TOKEN:-laplace}
      - SSO_REQUEST_SYSTEM=${SSO_REQUEST_SYSTEM:-NANZI_AI_AGENT_PLATFORM}
      - SSO_REQUEST_BUSINESS=${SSO_REQUEST_BUSINESS:-USER-LOGIN}
      - SSO_TIMEOUT=${SSO_TIMEOUT:-30}
      # 默认登录方式（local / ad）；两种方式的开关（on / off）：
      # off 的那一项在登录页置灰不可选，后端也会拒绝该方式的请求，两个都 off 则整体禁用。
      - SSO_LOGIN_DEFAULT_TYPE=${SSO_LOGIN_DEFAULT_TYPE:-ad}
      - SSO_LOGIN_AD=${SSO_LOGIN_AD:-on}
      - SSO_LOGIN_LOCAL=${SSO_LOGIN_LOCAL:-on}
    depends_on:
      - redis

    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    container_name: nanzi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
