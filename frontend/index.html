<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="NanZi AI Agent - 统一 AI 智能体服务、ChatBI、实时分析"
    />
    <title>NanZi AI Agent</title>
    <style>
      /* 首屏骨架：主包下载解析期间替代白屏。Vue 挂载到 #app 时会清空容器，骨架自动消失，
         不需要额外的移除逻辑。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f5f7fa;
      }
      .boot-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fa;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        z-index: 1;
      }
      .boot-skeleton .sk-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        box-sizing: border-box;
        width: min(380px, calc(100vw - 40px));
        padding: 30px 30px 26px;
        background: #fff;
        border: 1px solid #edf1f7;
        border-radius: 16px;
        box-shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
      }
      .boot-skeleton .sk-logo {
        width: 44px;
        height: 44px;
        margin-bottom: 6px;
        border-radius: 12px;
        background: #eef2f7;
        background-image: linear-gradient(90deg, #eef2f7 25%, #e3e9f2 37%, #eef2f7 63%);
        background-size: 400% 100%;
        animation: sk-shimmer 1.6s ease infinite;
      }
      .boot-skeleton .sk-name {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.2px;
        color: #334155;
      }
      .boot-skeleton .sk-line {
        height: 10px;
        border-radius: 6px;
        background: #eef2f7;
        background-image: linear-gradient(90deg, #eef2f7 25%, #e3e9f2 37%, #eef2f7 63%);
        background-size: 400% 100%;
        animation: sk-shimmer 1.6s ease infinite;
      }
      .boot-skeleton .sk-line-1 {
        width: 100%;
      }
      .boot-skeleton .sk-line-2 {
        width: 82%;
      }
      .boot-skeleton .sk-line-3 {
        width: 58%;
      }
      @keyframes sk-shimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }
      .boot-skeleton .sk-progress {
        position: relative;
        width: 180px;
        max-width: 60vw;
        height: 3px;
        margin-top: 8px;
        border-radius: 99px;
        background: #eef2f7;
        overflow: hidden;
      }
      .boot-skeleton .sk-progress i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 36%;
        border-radius: 99px;
        background: #c7d4e6;
        animation: sk-run 1.5s ease-in-out infinite;
      }
      @keyframes sk-run {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .boot-skeleton .sk-hint {
        position: absolute;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        font-size: 12px;
        color: #a8b3c4;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-skeleton .sk-logo,
        .boot-skeleton .sk-line,
        .boot-skeleton .sk-progress i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 骨架屏：主包加载完成后由 Vue 挂载自动清除 -->
      <div class="boot-skeleton" aria-hidden="true">
        <div class="sk-card">
          <div class="sk-logo"></div>
          <div class="sk-name">Intelligent Agent Platform</div>
          <div class="sk-line sk-line-1"></div>
          <div class="sk-line sk-line-2"></div>
          <div class="sk-line sk-line-3"></div>
          <div class="sk-progress"><i></i></div>
        </div>
        <div class="sk-hint">正在加载…</div>
      </div>
    </div>
    <script>
      /* 骨架兜底：主包异常（构建中访问、网络中断）时骨架会一直转，不能让用户干等。
         6 秒后补一句提示，告诉他刷新即可，而不是继续盯着动画。 */
      (function () {
        window.setTimeout(function () {
          var sk = document.querySelector(".boot-skeleton");
          if (!sk) return; // 已经挂载完成，骨架被 Vue 清掉了
          var hint = sk.querySelector(".sk-hint");
          if (hint) hint.textContent = "加载时间较长，若长时间无响应请刷新页面";
        }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
