[pytest]
asyncio_mode = auto
# 整个测试会话共用一个 event loop。async engine 的连接绑定在创建它的 loop 上，
# 默认的 function 级 loop 会让每个用例都不得不 dispose 整个连接池再重建——
# 全量 12000+ 用例就是 12000+ 次 MySQL 握手与断开，既慢又给数据库制造无谓负载。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
markers =
    no_infrastructure: skip shared database and redis initialization for isolated unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
